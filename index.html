<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151A24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prompter">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Prompter</title>
<style>
:root{
  --booth:#151A24; --booth-2:#1E2532; --line:#2E3748;
  --paper:#F2F0EA; --dim:#8B93A5; --cue:#8FD3E8; --rec:#FF4D4F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--booth);color:var(--paper);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cue);outline-offset:2px}
.view{position:fixed;inset:0;display:none}
.view.on{display:flex}

.btn{background:var(--booth-2);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--paper);color:var(--booth);border-color:var(--paper);font-weight:650}
.btn.ghost{background:transparent}
.chip{border-radius:999px;padding:8px 14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--cue);border-color:var(--cue);color:var(--booth);font-weight:600}

/* Editor */
#editor{flex-direction:column;gap:12px;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px)}
#editor header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
#editor h1{margin:0;font:600 30px/1.1 Georgia,"Times New Roman",serif}
#editor header p{margin:6px 0 0;color:var(--dim);font-size:14px}
#script{flex:1;min-height:0;resize:none;background:var(--booth-2);border:1px solid var(--line);
  border-radius:14px;padding:16px;font:19px/1.6 Georgia,"Times New Roman",serif}
#script::placeholder{color:var(--dim)}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:14px}
.foot{color:var(--dim);font-size:13px;margin:0;text-align:center}
#openBtn{width:100%;padding:16px;font-size:17px}

/* Stage */
#stage{background:var(--booth);overflow:hidden;touch-action:none}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--booth)}
#cam.front{transform:scaleX(-1)}
#top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:calc(var(--sat) + 8px) 12px 8px;pointer-events:none}
#top > *{pointer-events:auto}
#top .btn{background:rgba(21,26,36,.75)}
#status{font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px #000}
#status.live{color:var(--rec)}

#box{position:absolute;z-index:4;display:flex;flex-direction:column;overflow:hidden;
  border-radius:18px;border:1px solid rgba(255,255,255,.14);
  background:rgba(21,26,36,var(--alpha,.55))}
#boxbar{height:30px;flex:none;display:grid;place-items:center;touch-action:none;cursor:grab}
#boxbar i{display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.6)}
#vp{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#vp.mirror{transform:scaleX(-1)}
#text{position:relative;padding:0 16px;text-align:left;font-weight:700;line-height:1.35;
  text-shadow:0 1px 4px rgba(0,0,0,.7);will-change:transform;user-select:none;-webkit-user-select:none}
#text p{margin:0 0 .55em}
#text .gap{height:.9em}
.w{transition:opacity .25s,color .25s}
.w.done{opacity:.35}
.w.now{color:var(--cue)}
#rl{position:absolute;left:0;right:0;height:0;border-top:1px solid rgba(143,211,232,.45);pointer-events:none}
#rl::before{content:"";position:absolute;left:0;top:-7px;border-left:10px solid var(--cue);
  border-top:7px solid transparent;border-bottom:7px solid transparent}
#grip{position:absolute;right:0;bottom:0;width:44px;height:44px;display:flex;align-items:flex-end;
  justify-content:flex-end;padding:7px;touch-action:none;cursor:nwse-resize;color:rgba(255,255,255,.85)}

#bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  align-items:center;gap:30px;padding:12px 16px calc(var(--sab) + 18px)}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(21,26,36,.7);border:1px solid rgba(255,255,255,.22);color:var(--paper)}
#recBtn{width:74px;height:74px;border-radius:50%;border:4px solid var(--paper);background:transparent;
  position:relative;cursor:pointer;flex:none}
#recBtn::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--rec)}
#recBtn.on::after{inset:19px;border-radius:5px}
#cd{position:absolute;inset:0;z-index:8;display:grid;place-items:center;font-size:34vmin;
  font-weight:800;background:rgba(0,0,0,.4);text-shadow:0 4px 24px #000}

#sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;pointer-events:none}
.sheetbody{pointer-events:auto;width:100%;max-height:62vh;overflow:auto;touch-action:pan-y;
  background:rgba(21,26,36,.96);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:14px 16px calc(var(--sab) + 14px);display:flex;flex-direction:column;gap:12px}
.sheethead{display:flex;justify-content:space-between;align-items:center}
.sheethead b{font:600 20px/1 Georgia,serif}
.hint{margin:-4px 0 0;color:var(--dim);font-size:12px;line-height:1.4}
.row{display:flex;gap:12px;align-items:center}
.row.wrap{flex-wrap:wrap}
.ctl{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--dim);min-width:0}
.ctl b{color:var(--paper);font-weight:600}
input[type=range]{width:100%;accent-color:var(--cue);margin:6px 0}

/* Review */
#review{flex-direction:column;gap:12px;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 16px)}
#review h2{margin:0;font:600 22px/1.2 Georgia,serif}
#playback{flex:1;min-height:0;width:100%;background:#000;border-radius:14px;object-fit:contain}
#review .row .btn{flex:1}

#toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:50;
  max-width:90vw;background:var(--paper);color:var(--booth);padding:10px 16px;border-radius:12px;
  font-size:14px;font-weight:550;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>

<section id="editor" class="view on">
  <header>
    <div>
      <h1>Prompter</h1>
      <p>Write your script, then read it over your camera.</p>
    </div>
    <button id="installBtn" class="btn ghost" hidden>Install app</button>
  </header>
  <textarea id="script" placeholder="Paste your script here. Put each sentence on its own line, and leave a blank line where you want a pause." aria-label="Script"></textarea>
  <div class="meta">
    <span id="wc">0 words</span>
    <button id="clearBtn" class="btn ghost" style="min-height:36px;padding:6px 12px">Clear</button>
  </div>
  <button id="openBtn" class="btn primary">Open prompter</button>
  <p class="foot">Works offline once installed. Voice follow needs internet.</p>
</section>

<section id="stage" class="view">
  <video id="cam" playsinline muted autoplay></video>

  <div id="top">
    <button id="backBtn" class="btn">Back</button>
    <span id="status"></span>
    <button id="flipBtn" class="btn">Flip camera</button>
  </div>

  <div id="box">
    <div id="boxbar" aria-label="Drag to move the script box"><i></i></div>
    <div id="vp"><div id="text"></div><div id="rl"></div></div>
    <div id="grip" aria-label="Drag to resize the script box">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 9 9 21M21 16l-5 5"/></svg>
    </div>
  </div>

  <div id="bottom">
    <button id="playBtn" class="round" aria-label="Play"></button>
    <button id="recBtn" aria-label="Record"></button>
    <button id="gearBtn" class="round" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>

  <div id="sheet" hidden>
    <div class="sheetbody">
      <div class="sheethead"><b>Settings</b><button id="closeSheet" class="btn primary" style="min-height:38px;padding:6px 16px">Done</button></div>
      <div class="row">
        <label class="ctl" id="speedWrap"><span>Speed <b id="speedV"></b></span>
          <input id="speed" type="range" min="10" max="300" step="5"></label>
        <label class="ctl"><span>Text size <b id="sizeV"></b></span>
          <input id="size" type="range" min="14" max="72" step="2"></label>
      </div>
      <label class="ctl"><span>Box darkness</span>
        <input id="alphaIn" type="range" min="0" max="0.9" step="0.05"></label>
      <div class="row">
        <button id="mirrorBtn" class="btn chip" style="flex:1" aria-pressed="false">Mirror text</button>
        <button id="voiceBtn" class="btn chip" style="flex:1" aria-pressed="false">Voice follow</button>
      </div>
      <button id="mirrorRecBtn" class="btn chip" aria-pressed="true">Mirror my recording</button>
      <p class="hint">Saves your front camera video the way you see yourself in the mirror. It does not affect the back camera.</p>
      <div class="row wrap">
        <button id="restartBtn" class="btn" style="flex:1">Restart script</button>
        <button id="resetBoxBtn" class="btn" style="flex:1">Reset box</button>
      </div>
    </div>
  </div>

  <div id="cd" hidden></div>
</section>

<section id="review" class="view">
  <h2>Your recording</h2>
  <video id="playback" controls playsinline></video>
  <div class="row">
    <button id="saveBtn" class="btn primary">Save video</button>
    <button id="shareBtn" class="btn" hidden>Share</button>
  </div>
  <div class="row">
    <button id="againBtn" class="btn">Record again</button>
    <button id="doneBtn" class="btn ghost">Back to script</button>
  </div>
</section>

<div id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const normWord = t => t.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

/* ---------- saved settings ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('prompter:' + k); return v === null ? d : JSON.parse(v); }catch(_){ return d; } },
  set(k, v){ try{ localStorage.setItem('prompter:' + k, JSON.stringify(v)); }catch(_){} }
};
const S = {
  script: store.get('script', ''), spd: store.get('spd', 45), fs: store.get('fs', 26),
  alpha: store.get('alpha', 0.55), mirror: store.get('mirror', false),
  voice: store.get('voice', false), facing: store.get('facing', 'user'), mirrorRec: store.get('mirrorRec', true),
  bx: store.get('bx', 0.06), by: store.get('by', null), bw: store.get('bw', 0.88), bh: store.get('bh', 0.32)
};
const save = () => { for (const k in S) store.set(k, S[k]); };

/* ---------- elements ---------- */
const views = { editor: $('#editor'), stage: $('#stage'), review: $('#review') };
const show = n => { for (const k in views) views[k].classList.toggle('on', k === n); };
const stage = views.stage;
const ta = $('#script'), wc = $('#wc'), installBtn = $('#installBtn');
const cam = $('#cam'), box = $('#box'), boxbar = $('#boxbar'), grip = $('#grip');
const vp = $('#vp'), text = $('#text'), rlEl = $('#rl');
const topbar = $('#top'), statusEl = $('#status'), cd = $('#cd'), sheet = $('#sheet');
const speedIn = $('#speed'), sizeIn = $('#size'), alphaIn = $('#alphaIn');
const mirrorRecBtn = $('#mirrorRecBtn'), mirrorBtn = $('#mirrorBtn'), voiceBtn = $('#voiceBtn'), playBtn = $('#playBtn'), recBtn = $('#recBtn');
const playback = $('#playback'), shareBtn = $('#shareBtn');

let toastTimer;
function toast(msg, ms = 3400){
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, ms);
}

/* ---------- editor ---------- */
ta.value = S.script;
function updateCount(){
  const n = (ta.value.trim().match(/\S+/g) || []).length;
  const mins = n / 150;
  wc.textContent = n === 0 ? '0 words'
    : `${n} words, about ${mins < 1 ? Math.max(1, Math.round(mins * 60)) + ' sec' : Math.round(mins * 10) / 10 + ' min'} to read aloud`;
}
ta.addEventListener('input', () => { S.script = ta.value; store.set('script', S.script); updateCount(); });
$('#clearBtn').onclick = () => { ta.value = ''; S.script = ''; store.set('script', ''); updateCount(); ta.focus(); };
updateCount();

/* ---------- script text ---------- */
let spans = [], norm = [];
function buildText(){
  norm = [];
  let html = '';
  for (const line of S.script.replace(/\r/g, '').split('\n')){
    if (!line.trim()){ html += '<div class="gap"></div>'; continue; }
    html += '<p>' + line.trim().split(/\s+/).map(t => {
      norm.push(normWord(t));
      return `<span class="w">${esc(t)}</span>`;
    }).join(' ') + '</p>';
  }
  text.innerHTML = html;
  spans = Array.from(text.querySelectorAll('.w'));
}

/* ---------- script box: place, move, resize ---------- */
const MIN_W = 150, MIN_H = 110;
function placeBox(){
  const W = stage.clientWidth, Hs = stage.clientHeight;
  const w = clamp(Math.round(S.bw * W), Math.min(MIN_W, W), W);
  const h = clamp(Math.round(S.bh * Hs), Math.min(MIN_H, Hs), Hs);
  if (S.by === null) S.by = (topbar.offsetHeight + 6) / Hs;
  const l = clamp(Math.round(S.bx * W), 0, Math.max(0, W - w));
  const t = clamp(Math.round(S.by * Hs), 0, Math.max(0, Hs - h));
  box.style.left = l + 'px'; box.style.top = t + 'px';
  box.style.width = w + 'px'; box.style.height = h + 'px';
}

let gesture = null;
function startGesture(type, e){
  gesture = { type, x: e.clientX, y: e.clientY, l: box.offsetLeft, t: box.offsetTop, w: box.offsetWidth, h: box.offsetHeight };
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  e.stopPropagation();
}
boxbar.addEventListener('pointerdown', e => startGesture('move', e));
grip.addEventListener('pointerdown', e => startGesture('size', e));
for (const el of [boxbar, grip]){
  el.addEventListener('pointermove', e => {
    if (!gesture) return;
    const W = stage.clientWidth, Hs = stage.clientHeight;
    const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
    if (gesture.type === 'move'){
      S.bx = clamp(gesture.l + dx, 0, W - gesture.w) / W;
      S.by = clamp(gesture.t + dy, 0, Hs - gesture.h) / Hs;
      placeBox();
    } else {
      S.bw = clamp(gesture.w + dx, MIN_W, W - gesture.l) / W;
      S.bh = clamp(gesture.h + dy, MIN_H, Hs - gesture.t) / Hs;
      layout(true);
    }
  });
  const endG = () => { if (gesture){ gesture = null; save(); } };
  el.addEventListener('pointerup', endG);
  el.addEventListener('pointercancel', endG);
}

/* ---------- scrolling ---------- */
let pos = 0, maxPos = 0, rl = 0, playing = false, dragging = false;
let idx = 0, target = null, last = 0, raf = 0, stageOn = false, camOk = false;

const apply = () => { text.style.transform = `translate3d(0,${-pos}px,0)`; };

function layout(keep){
  const ratio = maxPos > 0 ? pos / maxPos : 0;
  placeBox();
  text.style.fontSize = S.fs + 'px';
  const H = vp.clientHeight;
  rl = Math.round(H * 0.35);
  rlEl.style.top = rl + 'px';
  text.style.paddingTop = rl + 'px';
  text.style.paddingBottom = Math.max(0, H - rl) + 'px';
  maxPos = Math.max(0, text.offsetHeight - H);
  if (keep){
    pos = (S.voice && spans.length)
      ? clamp(spans[Math.min(idx, spans.length - 1)].offsetTop - rl, 0, maxPos)
      : ratio * maxPos;
  }
  apply();
}

function nearestIdx(){
  const y = pos + rl - 6;
  const k = spans.findIndex(s => s.offsetTop >= y);
  return k === -1 ? Math.max(0, spans.length - 1) : k;
}
function markWords(){
  spans.forEach((s, i) => {
    s.className = 'w' + (S.voice ? (i < idx ? ' done' : i === idx ? ' now' : '') : '');
  });
}
function aim(){
  if (!spans.length) return;
  target = clamp(spans[Math.min(idx, spans.length - 1)].offsetTop - rl, 0, maxPos);
}

function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (playing && !dragging){
    if (S.voice){
      if (target !== null) pos += (target - pos) * Math.min(1, dt * 4);
    } else {
      pos += S.spd * dt;
      if (pos >= maxPos){ pos = maxPos; setPlaying(false); }
    }
    apply();
  }
  raf = requestAnimationFrame(frame);
}

function setPlaying(v){
  playing = v;
  playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play');
  if (S.voice){ if (v){ aim(); recStart(); } else recStop(); }
  last = performance.now();
}
function togglePlay(){
  if (!playing && !S.voice && pos >= maxPos - 1) pos = 0;
  setPlaying(!playing);
}

/* drag text to scroll, tap text to play or pause */
let sy = 0, sp = 0, moved = false;
vp.addEventListener('pointerdown', e => {
  dragging = true; moved = false; sy = e.clientY; sp = pos;
  try{ vp.setPointerCapture(e.pointerId); }catch(_){}
});
vp.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dy = e.clientY - sy;
  if (Math.abs(dy) > 6) moved = true;
  if (moved){ pos = clamp(sp - dy, 0, maxPos); apply(); }
});
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  if (!moved) togglePlay();
  else if (S.voice){ idx = nearestIdx(); markWords(); aim(); }
};
vp.addEventListener('pointerup', endDrag);
vp.addEventListener('pointercancel', endDrag);

/* ---------- controls ---------- */
function syncControls(){
  speedIn.value = S.spd; $('#speedV').textContent = S.spd;
  sizeIn.value = S.fs; $('#sizeV').textContent = S.fs;
  alphaIn.value = S.alpha; box.style.setProperty('--alpha', S.alpha);
  vp.classList.toggle('mirror', S.mirror);
  mirrorBtn.setAttribute('aria-pressed', S.mirror);
  mirrorRecBtn.setAttribute('aria-pressed', S.mirrorRec);
  syncVoiceUI();
}
function syncVoiceUI(){
  voiceBtn.setAttribute('aria-pressed', S.voice);
  speedIn.disabled = S.voice;
  $('#speedWrap').style.opacity = S.voice ? .4 : 1;
}

speedIn.oninput = () => { S.spd = +speedIn.value; $('#speedV').textContent = S.spd; save(); };
sizeIn.oninput = () => { S.fs = +sizeIn.value; $('#sizeV').textContent = S.fs; save(); layout(true); };
alphaIn.oninput = () => { S.alpha = +alphaIn.value; box.style.setProperty('--alpha', S.alpha); save(); };
mirrorBtn.onclick = () => { S.mirror = !S.mirror; save(); syncControls(); };
mirrorRecBtn.onclick = () => {
  if (recorder && recorder.state === 'recording'){ toast('Change this before you start recording.'); return; }
  S.mirrorRec = !S.mirrorRec; save(); syncControls();
};
voiceBtn.onclick = () => {
  S.voice = !S.voice; save(); syncVoiceUI();
  if (S.voice){ idx = nearestIdx(); markWords(); if (playing){ aim(); recStart(); } }
  else { recStop(); markWords(); }
};
playBtn.onclick = togglePlay;
$('#gearBtn').onclick = () => { sheet.hidden = !sheet.hidden; };
$('#closeSheet').onclick = () => { sheet.hidden = true; };
$('#restartBtn').onclick = () => { setPlaying(false); pos = 0; idx = 0; target = null; markWords(); apply(); };
$('#resetBoxBtn').onclick = () => { S.bx = 0.06; S.by = null; S.bw = 0.88; S.bh = 0.32; save(); layout(true); };
window.addEventListener('resize', () => { if (stageOn) layout(true); });
document.addEventListener('keydown', e => {
  if (!stageOn || !views.stage.classList.contains('on')) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowUp'){ S.spd = clamp(S.spd + 10, 10, 300); syncControls(); save(); }
  if (e.code === 'ArrowDown'){ S.spd = clamp(S.spd - 10, 10, 300); syncControls(); save(); }
});

/* ---------- voice follow ---------- */
let rec = null, recWanted = false;
const lev1 = (a, b) => {
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
};
const similar = (a, b) => a === b || (a.length > 3 && b.length > 3 && (a.startsWith(b) || b.startsWith(a))) || (a.length > 4 && lev1(a, b));

function voiceOff(msg){
  recStop(); S.voice = false; save(); syncVoiceUI(); markWords();
  if (msg) toast(msg, 4500);
}
function recStart(){
  if (rec) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ voiceOff('Voice follow is not supported in this browser. Using speed scroll.'); return; }
  recWanted = true;
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  rec.onresult = e => { const r = e.results[e.results.length - 1]; heard(r[0].transcript); };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') voiceOff('Microphone is blocked. Allow it to use voice follow.');
    else if (e.error === 'network') voiceOff('Voice follow needs internet. Using speed scroll.');
    else if (e.error === 'audio-capture') voiceOff('Voice follow cannot share the microphone while recording on this phone. Using speed scroll.');
  };
  rec.onend = () => {
    rec = null;
    if (recWanted && playing && S.voice && stageOn) setTimeout(recStart, 250);
  };
  try{ rec.start(); }catch(_){ rec = null; }
}
function recStop(){
  recWanted = false;
  if (rec){ try{ rec.onend = null; rec.stop(); }catch(_){} rec = null; }
}
function heard(transcript){
  if (!playing || !S.voice || !spans.length) return;
  const words = transcript.toLowerCase().split(/\s+/).map(normWord).filter(Boolean);
  if (!words.length) return;
  const tail = words.slice(-3);
  const need = Math.min(2, tail.length);
  let best = -1, bestScore = 0;
  const from = Math.max(0, idx - 2), to = Math.min(norm.length - 1, idx + 30);
  for (let k = from; k <= to; k++){
    if (!norm[k] || !similar(tail[tail.length - 1], norm[k])) continue;
    let score = 1, j = k - 1;
    for (let n = tail.length - 2; n >= 0; n--){
      while (j >= 0 && !norm[j]) j--;
      if (j < 0) break;
      if (similar(tail[n], norm[j])) score++;
      j--;
    }
    if (score >= need && score > bestScore){ best = k; bestScore = score; }
  }
  if (best === -1) return;
  idx = best + 1;
  while (idx < norm.length && !norm[idx]) idx++;
  if (idx >= spans.length){ idx = spans.length; markWords(); target = maxPos; setPlaying(false); return; }
  markWords(); aim();
}

/* ---------- camera ---------- */
let stream = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function tryGet(c){
  try{ return { s: await navigator.mediaDevices.getUserMedia(c) }; }
  catch(e){ return { e }; }
}
async function getStream(facing){
  let err = null;
  const videos = [
    { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30, max: 30 } },
    { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
    { facingMode: { ideal: facing } }
  ];
  for (const audio of [true, false]){
    for (const video of videos){
      const r = await tryGet({ video, audio });
      if (r.s) return { stream: r.s, noMic: !audio };
      err = r.e;
      if (err && err.name === 'NotAllowedError') return { err };
    }
  }
  // last resort: pick the camera by name
  try{
    const all = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const want = facing === 'user' ? /front|user|selfie|face/i : /back|rear|environment/i;
    const ordered = all.filter(d => want.test(d.label)).concat(all.filter(d => !want.test(d.label)));
    for (const d of ordered){
      for (const audio of [true, false]){
        const r = await tryGet({ video: { deviceId: { exact: d.deviceId } }, audio });
        if (r.s) return { stream: r.s, noMic: !audio };
        err = r.e || err;
      }
    }
  }catch(_){}
  return { err };
}
function camMsg(e){
  const n = (e && e.name) || 'Error';
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera is blocked. In Chrome, tap the lock icon, then Permissions, and allow Camera.';
  if (n === 'NotReadableError' || n === 'AbortError') return 'Another app is using the camera. Close TikTok, WhatsApp and the Camera app, then tap Flip camera.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'This phone could not find that camera.';
  return 'Camera would not start (' + n + ').';
}
let camBusy = false;
async function openCam(){
  if (camBusy) return;
  camBusy = true;
  try{
    const had = !!stream;
    closeCam();
    if (had) await sleep(350);
    let res = await getStream(S.facing);
    if (!res.stream && res.err && (res.err.name === 'NotReadableError' || res.err.name === 'AbortError')){
      await sleep(900); res = await getStream(S.facing);
    }
    stream = res.stream || null; camOk = !!stream;
    if (stream){
      const vt = stream.getVideoTracks()[0], actual = vt && vt.getSettings ? vt.getSettings().facingMode : '';
      if (actual === 'environment' && S.facing === 'user'){
        S.facing = 'environment'; save();
        toast('The front camera would not start, so the back camera is showing.', 6000);
      } else if (actual === 'user' && S.facing !== 'user'){ S.facing = 'user'; save(); }
      cam.srcObject = stream; cam.classList.toggle('front', S.facing === 'user'); cam.play().catch(() => {});
      if (res.noMic) toast('Microphone is off. Recordings will have no sound.', 5000);
    } else {
      toast(camMsg(res.err), 9000);
    }
  } finally { camBusy = false; }
}
function closeCam(){
  stopFlip();
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; cam.srcObject = null; camOk = false;
}
$('#flipBtn').onclick = async () => {
  if (recorder && recorder.state === 'recording'){ toast('Stop recording before flipping the camera.'); return; }
  S.facing = S.facing === 'user' ? 'environment' : 'user'; save(); await openCam();
};

/* ---------- recording ---------- */
let recorder = null, chunks = [], blob = null, blobUrl = '', recTimer = 0, recStarted = 0, busy = false;
const pickMime = () => ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=h264,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

let flipActive = false, flipCanvas = null, flipOut = null;
function stopFlip(){
  flipActive = false;
  if (flipOut) flipOut.getVideoTracks().forEach(t => t.stop());
  flipOut = null; flipCanvas = null;
}
function makeRecStream(){
  if (!(S.mirrorRec && S.facing === 'user')) return stream;
  try{
    const vt = stream.getVideoTracks()[0], st = vt ? vt.getSettings() : {};
    const w = cam.videoWidth || st.width || 1280, h = cam.videoHeight || st.height || 720;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    if (!c.captureStream) return stream;
    const ctx = c.getContext('2d', { alpha: false });
    const draw = () => {
      if (!flipActive) return;
      ctx.save(); ctx.translate(w, 0); ctx.scale(-1, 1); ctx.drawImage(cam, 0, 0, w, h); ctx.restore();
      next();
    };
    const next = () => { if (cam.requestVideoFrameCallback) cam.requestVideoFrameCallback(draw); else requestAnimationFrame(draw); };
    flipCanvas = c; flipActive = true;
    ctx.save(); ctx.translate(w, 0); ctx.scale(-1, 1); ctx.drawImage(cam, 0, 0, w, h); ctx.restore();
    next();
    flipOut = new MediaStream([...c.captureStream(30).getVideoTracks(), ...stream.getAudioTracks()]);
    return flipOut;
  }catch(_){ stopFlip(); return stream; }
}

function countdown(n){
  return new Promise(res => {
    let i = n; cd.hidden = false; cd.textContent = i;
    const t = setInterval(() => {
      i--;
      if (i <= 0){ clearInterval(t); cd.hidden = true; res(); } else cd.textContent = i;
    }, 1000);
  });
}
function tick(){
  const s = Math.floor((Date.now() - recStarted) / 1000);
  statusEl.textContent = `Recording ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
async function onRecord(){
  if (busy) return;
  if (recorder && recorder.state === 'recording'){ stopRecording(); return; }
  if (!stream){ toast('Turn the camera on to record.'); return; }
  if (!window.MediaRecorder){ toast('This browser cannot record video.'); return; }
  sheet.hidden = true;
  busy = true; await countdown(3); busy = false;
  const mime = pickMime();
  chunks = [];
  const recSource = makeRecStream();
  try{ recorder = new MediaRecorder(recSource, mime ? { mimeType: mime, videoBitsPerSecond: 3500000 } : undefined); }
  catch(_){
    try{ recorder = new MediaRecorder(recSource); }catch(__){ stopFlip(); toast('Recording is not available on this device.'); return; }
  }
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stopFlip();
    blob = new Blob(chunks, { type: recorder.mimeType || mime || 'video/webm' });
    showReview();
  };
  recorder.start(1000);
  recBtn.classList.add('on'); statusEl.classList.add('live');
  recStarted = Date.now(); tick(); recTimer = setInterval(tick, 500);
  if (!playing) setPlaying(true);
}
function stopRecording(){
  clearInterval(recTimer);
  recBtn.classList.remove('on'); statusEl.classList.remove('live'); statusEl.textContent = '';
  setPlaying(false);
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}
recBtn.onclick = onRecord;

const fileName = () => `prompter-${Date.now()}.${blob.type.includes('mp4') ? 'mp4' : 'webm'}`;
function showReview(){
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  playback.src = blobUrl;
  let canShare = false;
  try{ canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([blob], fileName(), { type: blob.type })] })); }catch(_){}
  shareBtn.hidden = !canShare;
  show('review');
}
$('#saveBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = blobUrl; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
};
shareBtn.onclick = async () => {
  try{ await navigator.share({ files: [new File([blob], fileName(), { type: blob.type })], title: 'Prompter video' }); }catch(_){}
};
$('#againBtn').onclick = () => { playback.pause(); show('stage'); layout(true); };
$('#doneBtn').onclick = () => { playback.pause(); leaveStage(); };

/* ---------- stage open and close ---------- */
let wake = null;
const lockScreen = async () => { try{ wake = await navigator.wakeLock.request('screen'); }catch(_){} };
document.addEventListener('visibilitychange', () => { if (stageOn && document.visibilityState === 'visible') lockScreen(); });

async function openStage(){
  S.script = ta.value.trim();
  if (!S.script){ toast('Write or paste your script first.'); return; }
  save(); buildText(); show('stage'); stageOn = true; sheet.hidden = true;
  syncControls(); pos = 0; idx = 0; target = null; maxPos = 0;
  layout(false); markWords(); setPlaying(false);
  lockScreen(); last = performance.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  if (!store.get('hint', false)){
    store.set('hint', true);
    toast('Drag the corner to resize the script box. Drag the bar at its top to move it.', 7000);
  }
  await openCam();
}
function leaveStage(){
  setPlaying(false); recStop(); closeCam();
  stageOn = false; cancelAnimationFrame(raf);
  try{ if (wake) wake.release(); }catch(_){}
  show('editor');
}
$('#openBtn').onclick = openStage;
$('#backBtn').onclick = () => {
  if (recorder && recorder.state === 'recording'){ stopRecording(); return; }
  leaveStage();
};

/* ---------- install ---------- */
let deferred = null;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; installBtn.hidden = false; });
window.addEventListener('appinstalled', () => { installBtn.hidden = true; });
if (isIOS && !standalone) installBtn.hidden = false;
installBtn.onclick = async () => {
  if (deferred){ deferred.prompt(); await deferred.userChoice; deferred = null; installBtn.hidden = true; }
  else toast('Tap the Share button, then choose Add to Home Screen.', 6000);
};

playBtn.innerHTML = ICON_PLAY;
window.addEventListener('load', () => {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
});
})();
</script>
</body>
